# The fragment gate: a PR that touches code must carry a changelog fragment.
# Hard fail, not a warning. `chore`/`docs` fragments are the escape hatch
# (they never render). The release PR is exempt: its whole job is consuming
# fragments. Only the one release-pr.yml maintains is: `release/next` pushed to
# this repository, which a fork's branch of the same name is not.

name: changelog-check

on:
  pull_request:

permissions:
  pull-requests: read

jobs:
  fragment:
    if: "!(github.event.pull_request.head.ref == 'release/next' && github.event.pull_request.head.repo.full_name == github.repository)"
    runs-on: ubuntu-latest
    steps:
      - name: Require a fragment when code changed
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          files=$(gh api "repos/$REPO/pulls/$PR/files" --paginate -q '.[].filename')
          echo "$files"
          # A fragment only counts if it is still there after the PR: deleting one is not adding one
          kept=$(gh api "repos/$REPO/pulls/$PR/files" --paginate -q '.[] | select(.status != "removed") | .filename')
          code=$(echo "$files" | grep -E '^(stemlab/|app/src/|app/scripts/|app/electron-builder\.cjs|app/package\.json|recipes/|third_party/|pyproject\.toml)' || true)
          fragment=$(echo "$kept" | grep -E '^changelog\.d/([0-9]+|\+[a-z0-9-]+)\.(breaking|feature|bugfix|chore|docs)\.md$' || true)
          bad=$(echo "$kept" | grep -E '^changelog\.d/' | grep -vE '^changelog\.d/(README\.md|([0-9]+|\+[a-z0-9-]+)\.(breaking|feature|bugfix|chore|docs)\.md)$' || true)
          if [ -n "$bad" ]; then
            echo "::error::changelog.d file doesn't match <issue>.<type>.md or +<slug>.<type>.md with a valid type: $bad"
            exit 1
          fi
          if [ -n "$code" ] && [ -z "$fragment" ]; then
            echo "::error::This PR touches code but adds no changelog fragment. Add changelog.d/<issue>.<type>.md or +<slug>.<type>.md (types: breaking, feature, bugfix, chore, docs - see changelog.d/README.md)."
            exit 1
          fi
